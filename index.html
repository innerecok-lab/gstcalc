    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: manipulation;
        }
        .btn-calc {
            transition: transform 0.05s ease, background-color 0.1s ease, filter 0.1s ease;
        }
        .btn-calc:active {
            transform: scale(0.94);
        }
        .display-tape::-webkit-scrollbar {
            width: 4px;
        }
        .display-tape::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.4);
            border-radius: 4px;
        }

        @media print {
            body * { visibility: hidden; }
            #printableReceipt, #printableReceipt * { visibility: visible; }
            #printableReceipt {
                position: absolute;
                left: 0; top: 0; width: 100%;
                background: white !important;
                color: black !important;
            }
        }

        /* Layout: centred column on big screens, safe on short/landscape phones */
        body { max-width: 32rem; margin: 0 auto; width: 100%; }
        #mainDisplay { user-select: text; -webkit-user-select: text; scrollbar-width: none; }
        @media (max-height: 560px) {
            .btn-num, .btn-op, .btn-action { padding-top: .4rem !important; padding-bottom: .4rem !important; }
            #mainDisplay { font-size: 1.75rem !important; }
        }
        @media print {
            body { max-width: none !important; height: auto !important; overflow: visible !important; }
            #printableReceipt { display: block !important; }
        }

        /* Themes */
        body.theme-light { background-color: #f3f4f6; color: #1e293b; }
        body.theme-light header { background-color: #ffffff; border-color: #e2e8f0; }
        body.theme-light .tape-bg { background-color: #f8fafc; border-color: #e2e8f0; }
        body.theme-light .keypad-bg { background-color: #e5e7eb; }
        body.theme-light .btn-num { background-color: #ffffff; color: #1e293b; border-color: #cbd5e1; }
        body.theme-light .btn-op { background-color: #f1f5f9; color: #2563eb; border-color: #cbd5e1; }
        body.theme-light .btn-gst { background-color: #ffffff; color: #2563eb; border-color: #cbd5e1; }
        body.theme-light .btn-action { background-color: #fff1f2; color: #e11d48; border-color: #fecdd3; }
        body.theme-light .btn-equal { background-color: #2563eb; color: #ffffff; }

        body.theme-dark { background-color: #0f172a; color: #f8fafc; }
        body.theme-dark header { background-color: #1e293b; border-color: #334155; }
        body.theme-dark .tape-bg { background-color: #0f172a; border-color: #334155; }
        body.theme-dark .keypad-bg { background-color: #1e293b; }
        body.theme-dark .btn-num { background-color: #334155; color: #f8fafc; border-color: #475569; }
        body.theme-dark .btn-op { background-color: #475569; color: #60a5fa; border-color: #64748b; }
        body.theme-dark .btn-gst { background-color: #334155; color: #38bdf8; border-color: #475569; }
        body.theme-dark .btn-action { background-color: #450a0a; color: #f87171; border-color: #7f1d1d; }
        body.theme-dark .btn-equal { background-color: #2563eb; color: #ffffff; }

        body.theme-solar { background-color: #8b9984; color: #1a2416; }
        body.theme-solar header { background-color: #7c8a75; border-color: #6a7764; }
        body.theme-solar .tape-bg { background-color: #9ab092; border-color: #7c8a75; }
        body.theme-solar .keypad-bg { background-color: #6e7c67; }
        body.theme-solar .btn-num { background-color: #272d24; color: #f3f4f6; border-color: #1c211a; }
        body.theme-solar .btn-op { background-color: #434c3f; color: #facc15; border-color: #333a30; }
        body.theme-solar .btn-gst { background-color: #3b4438; color: #86efac; border-color: #2b3229; }
        body.theme-solar .btn-action { background-color: #7f1d1d; color: #fca5a5; border-color: #450a0a; }
        body.theme-solar .btn-equal { background-color: #ca8a04; color: #ffffff; }
    </style>
</head>

    <!-- Top Navigation Bar -->
    <header class="min-h-[2.5rem] px-4 flex items-center justify-between border-b shrink-0 z-10">
        <div class="flex items-center space-x-2">
            <span class="font-extrabold text-sm tracking-tight flex items-center gap-1.5">
                <i class="fa-solid fa-calculator text-xs"></i> GST Calc Pro
            </span>
            <span id="pwaBadge" class="hidden text-[10px] bg-blue-500/10 text-brandBlue font-bold px-1.5 py-0.5 rounded border border-brandBlue/20">PWA</span>
        </div>
        <div class="flex items-center space-x-3">
            <button id="installPwaBtn" title="Install App" class="hidden text-xs bg-brandBlue text-white font-semibold px-2 py-0.5 rounded shadow-sm hover:bg-brandBlueHover transition items-center gap-1">
                <i class="fa-solid fa-download text-[10px]"></i> Install
            </button>
            <button id="tapeToggleBtn" title="History Tape" class="hover:opacity-75 text-sm transition p-1">
                <i class="fa-solid fa-receipt"></i>
            </button>
            <button id="settingsBtn" title="Settings" class="hover:opacity-75 text-sm transition p-1">
                <i class="fa-solid fa-gear"></i>
            </button>
            <button id="copyBtn" title="Copy Result" class="hover:opacity-75 text-sm transition p-1">
                <i class="fa-regular fa-copy"></i>
            </button>
            <button id="shareBtn" title="Share via WhatsApp/SMS" class="hover:opacity-75 text-sm transition p-1">
                <i class="fa-solid fa-share-nodes"></i>
            </button>
        </div>
    </header>

    <!-- Display & Calculation Output Tape Area -->
    <section class="tape-bg min-h-0 flex-grow flex flex-col justify-end px-5 py-3 border-b overflow-hidden relative">
        <div id="breakdownTape" class="display-tape overflow-y-auto max-h-full flex flex-col items-end space-y-3 text-right font-semibold text-sm sm:text-base">
            <div id="welcomeMessage" class="opacity-50 font-normal py-4 text-center w-full">Start calculating or select a GST rate...</div>
        </div>

        <div class="mt-2 pt-2 border-t border-slate-300/30 flex flex-col items-end w-full shrink-0">
            <div id="expressionDisplay" class="text-xs sm:text-sm opacity-60 font-medium h-5 overflow-hidden text-right w-full tracking-wide"></div>
            <div id="mainDisplay" class="text-3xl sm:text-4xl font-extrabold tracking-tight overflow-x-auto w-full text-right py-0.5 whitespace-nowrap">
                0
            </div>
        </div>
    </section>

    <!-- Keypad Controller -->
    <footer class="keypad-bg shrink-0 p-2 sm:p-3 space-y-1.5" style="padding-bottom:calc(0.5rem + env(safe-area-inset-bottom))">
        <div id="gstRows" class="space-y-1.5"></div>
        <div class="grid grid-cols-5 gap-1.5 sm:gap-2">
            <button class="btn-calc btn-num num-btn font-bold text-lg sm:text-xl py-3.5 rounded-xl shadow-sm border" data-num="7">7</button>
            <button class="btn-calc btn-num num-btn font-bold text-lg sm:text-xl py-3.5 rounded-xl shadow-sm border" data-num="8">8</button>
            <button class="btn-calc btn-num num-btn font-bold text-lg sm:text-xl py-3.5 rounded-xl shadow-sm border" data-num="9">9</button>
            <button class="btn-calc btn-op font-bold text-lg sm:text-xl py-3.5 rounded-xl shadow-sm border" data-op="÷">÷</button>
            <button class="btn-calc btn-action font-bold text-sm sm:text-base py-3.5 rounded-xl shadow-sm border" data-action="backspace"><i class="fa-solid fa-delete-left"></i></button>

            <button class="btn-calc btn-num num-btn font-bold text-lg sm:text-xl py-3.5 rounded-xl shadow-sm border" data-num="4">4</button>
            <button class="btn-calc btn-num num-btn font-bold text-lg sm:text-xl py-3.5 rounded-xl shadow-sm border" data-num="5">5</button>
            <button class="btn-calc btn-num num-btn font-bold text-lg sm:text-xl py-3.5 rounded-xl shadow-sm border" data-num="6">6</button>
            <button class="btn-calc btn-op font-bold text-lg sm:text-xl py-3.5 rounded-xl shadow-sm border" data-op="×">×</button>
            <button class="btn-calc btn-action font-bold text-sm sm:text-base py-3.5 rounded-xl shadow-sm border" data-action="ac">AC</button>

            <button class="btn-calc btn-num num-btn font-bold text-lg sm:text-xl py-3.5 rounded-xl shadow-sm border" data-num="1">1</button>
            <button class="btn-calc btn-num num-btn font-bold text-lg sm:text-xl py-3.5 rounded-xl shadow-sm border" data-num="2">2</button>
            <button class="btn-calc btn-num num-btn font-bold text-lg sm:text-xl py-3.5 rounded-xl shadow-sm border" data-num="3">3</button>
            <button class="btn-calc btn-op font-bold text-lg sm:text-xl py-3.5 rounded-xl shadow-sm border" data-op="-">-</button>
            <button class="btn-calc btn-op font-bold text-lg sm:text-xl py-3.5 rounded-xl shadow-sm border" data-action="percent">%</button>

            <button class="btn-calc btn-num num-btn font-bold text-lg sm:text-xl py-3.5 rounded-xl shadow-sm border" data-num="0">0</button>
            <button class="btn-calc btn-num num-btn font-bold text-lg sm:text-xl py-3.5 rounded-xl shadow-sm border" data-num="00">00</button>
            <button class="btn-calc btn-num num-btn font-bold text-lg sm:text-xl py-3.5 rounded-xl shadow-sm border" data-num=".">.</button>
            <button class="btn-calc btn-op font-bold text-lg sm:text-xl py-3.5 rounded-xl shadow-sm border" data-op="+">+</button>
            <button class="btn-calc btn-equal font-bold text-xl py-3.5 rounded-xl shadow-md" data-action="equals">=</button>
        </div>
    </footer>

    <!-- History Tape Drawer -->
    <div id="tapeDrawer" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 flex justify-end hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white text-slate-800 w-80 max-w-[85vw] h-full shadow-2xl flex flex-col justify-between">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="font-bold text-base flex items-center gap-2">
                    <i class="fa-solid fa-receipt text-brandBlue"></i> Calculation Tape Ledger
                </h3>
                <button id="closeTapeBtn" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div id="tapeHistoryList" class="p-4 overflow-y-auto flex-grow space-y-3 text-xs font-mono">
                <div class="text-slate-400 text-center py-8 font-sans">No history recorded yet</div>
            </div>

            <div class="p-4 border-t border-slate-100 space-y-2">
                <button id="printReceiptBtn" class="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 hover:bg-slate-800">
                    <i class="fa-solid fa-print"></i> Print Receipt / PDF
                </button>
                <button id="clearTapeBtn" class="w-full border border-rose-200 text-rose-600 font-semibold py-2 rounded-xl text-xs hover:bg-rose-50">
                    Clear History
                </button>
            </div>
        </div>
    </div>

    <!-- Printable Receipt -->
    <div id="printableReceipt" class="hidden p-6 font-mono text-sm space-y-4">
        <div class="text-center border-b pb-2">
            <h2 class="font-bold text-lg">GST CALCULATION RECEIPT</h2>
            <p class="text-xs text-slate-500" id="receiptDate"></p>
        </div>
        <div id="receiptItems" class="space-y-2"></div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white text-slate-800 rounded-2xl p-5 w-80 max-w-[90vw] shadow-xl border border-slate-100 flex flex-col space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="font-bold text-base flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-brandBlue"></i> Preferences
                </h3>
                <button id="closeSettingsBtn" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div>
                <label class="text-xs font-semibold text-slate-600 block mb-1.5">Decimal Places (GST amounts)</label>
                <div class="grid grid-cols-4 gap-2">
                    <button class="dec-opt-btn py-2 rounded-xl border font-bold text-xs" data-dec="0">0</button>
                    <button class="dec-opt-btn py-2 rounded-xl border font-bold text-xs" data-dec="2">2</button>
                    <button class="dec-opt-btn py-2 rounded-xl border font-bold text-xs" data-dec="3">3</button>
                    <button class="dec-opt-btn py-2 rounded-xl border font-bold text-xs" data-dec="4">4</button>
                </div>
            </div>
            <div>
                <label class="text-xs font-semibold text-slate-600 block mb-1.5">App Theme</label>
                <div class="grid grid-cols-3 gap-2">
                    <button class="theme-opt-btn py-2 rounded-xl border font-semibold text-xs flex flex-col items-center gap-1" data-theme="light">
                        <i class="fa-solid fa-sun text-amber-500"></i> Light
                    </button>
                    <button class="theme-opt-btn py-2 rounded-xl border font-semibold text-xs flex flex-col items-center gap-1" data-theme="dark">
                        <i class="fa-solid fa-moon text-indigo-400"></i> Dark
                    </button>
                    <button class="theme-opt-btn py-2 rounded-xl border font-semibold text-xs flex flex-col items-center gap-1" data-theme="solar">
                        <i class="fa-solid fa-calculator text-emerald-600"></i> Solar
                    </button>
                </div>
            </div>
            <div class="space-y-2 pt-1 border-t border-slate-100">
                <label class="flex items-center justify-between text-xs text-slate-700 cursor-pointer">
                    <span>Key Sound Feedback</span>
                    <input type="checkbox" id="soundToggle" class="accent-brandBlue">
                </label>
                <label class="flex items-center justify-between text-xs text-slate-700 cursor-pointer">
                    <span>Haptic Vibration</span>
                    <input type="checkbox" id="hapticToggle" class="accent-brandBlue">
                </label>
                <label class="flex items-center justify-between text-xs text-slate-700 cursor-pointer">
                    <span>Show old 12% / 28% slabs</span>
                    <input type="checkbox" id="legacyToggle" class="accent-brandBlue">
                </label>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed top-12 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-3.5 py-1.5 rounded-full text-xs font-semibold shadow-lg transition-all duration-300 opacity-0 pointer-events-none translate-y-[-10px] z-50">
        <span id="toastText">Copied!</span>
    </div>

    <!-- JavaScript Engine -->
    <script>
        const ls = {
            get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
            set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
            del(k) { try { localStorage.removeItem(k); } catch (e) {} }
        };
        const calcState = {
            currentInput: '0',
            previousInput: null,
            operator: null,
            awaitingNextNumber: false,
            decimalPrecision: (() => { const v = parseInt(ls.get('gst_dec')); return [0, 2, 3, 4].includes(v) ? v : 2; })(),
            theme: ['light', 'dark', 'solar'].includes(ls.get('gst_theme')) ? ls.get('gst_theme') : 'light',
            soundEnabled: ls.get('gst_sound') !== 'false',
            hapticEnabled: ls.get('gst_haptic') !== 'false',
            legacy: ls.get('gst_legacy') === 'true',
            history: (() => { try { const h = JSON.parse(ls.get('gst_history')); return Array.isArray(h) ? h : []; } catch (e) { return []; } })()
        };

        const mainDisplay = document.getElementById('mainDisplay');
        const expressionDisplay = document.getElementById('expressionDisplay');
        const breakdownTape = document.getElementById('breakdownTape');
        const toast = document.getElementById('toast');
        const settingsModal = document.getElementById('settingsModal');
        const tapeDrawer = document.getElementById('tapeDrawer');
        const tapeHistoryList = document.getElementById('tapeHistoryList');

        let audioCtx = null;
        function playClickSound() {
            if (!calcState.soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch(e) {}
        }

        function triggerHaptic() {
            if (calcState.hapticEnabled && navigator.vibrate) navigator.vibrate(10);
        }

        function handleKeyFeedback() {
            playClickSound();
            triggerHaptic();
        }

        // Indian digit grouping on a plain numeric string; keeps what the user typed (e.g. "1.0", "5.")
        function fmtInput(str) {
            if (str === 'Error') return str;
            const neg = str.startsWith('-');
            const [int, dec] = str.replace('-', '').split('.');
            const grouped = (int || '0').replace(/(\d)(?=(\d\d)+\d$)/g, '$1,');
            return (neg ? '-' : '') + grouped + (dec !== undefined ? '.' + dec : '');
        }
        function formatNumber(v, maxDec = 8, fixed = false) {
            const n = parseFloat(v);
            if (!isFinite(n)) return '0';
            return (n + 0).toLocaleString('en-IN', { minimumFractionDigits: fixed ? maxDec : 0, maximumFractionDigits: maxDec });
        }
        const money = v => formatNumber(v, calcState.decimalPrecision, true);
        // number -> clean string (no 0.1+0.2 noise, no exponent notation)
        function numToStr(n) {
            return (Math.round(n * 1e10) / 1e10).toLocaleString('en-US', { useGrouping: false, maximumFractionDigits: 10 });
        }

        function showToast(msg) {
            document.getElementById('toastText').textContent = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-[-10px]');
            setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-[-10px]'), 1800);
        }

        function updateDisplay() {
            mainDisplay.textContent = fmtInput(calcState.currentInput);
            const len = mainDisplay.textContent.length;
            mainDisplay.style.fontSize = len > 18 ? '1.25rem' : len > 15 ? '1.6rem' : len > 12 ? '2rem' : '';
            expressionDisplay.textContent = (calcState.previousInput !== null && calcState.operator)
                ? `${fmtInput(calcState.previousInput)} ${calcState.operator}` : '';
        }

        function setError() {
            calcState.currentInput = 'Error';
            calcState.previousInput = null;
            calcState.operator = null;
            calcState.awaitingNextNumber = true;
            updateDisplay();
        }

        function appendNumber(digit) {
            handleKeyFeedback();
            if (calcState.currentInput === 'Error') calcState.currentInput = '0';
            if (calcState.awaitingNextNumber) {
                calcState.currentInput = digit === '.' ? '0.' : (digit === '00' ? '0' : digit);
                calcState.awaitingNextNumber = false;
            } else if (digit === '.') {
                if (!calcState.currentInput.includes('.')) calcState.currentInput += '.';
            } else if (calcState.currentInput === '0') {
                calcState.currentInput = digit === '00' ? '0' : digit;
            } else if (calcState.currentInput.replace(/[-.]/g, '').length < 14) {
                calcState.currentInput += digit;
            }
            updateDisplay();
        }

        function handleOperator(op) {
            handleKeyFeedback();
            if (calcState.currentInput === 'Error') return;
            if (calcState.operator && !calcState.awaitingNextNumber) {
                executeMath();
                if (calcState.currentInput === 'Error') return;
            }
            calcState.previousInput = calcState.currentInput;
            calcState.operator = op;
            calcState.awaitingNextNumber = true;
            updateDisplay();
        }

        // opts lets % supply its own right-hand value/label (e.g. 100 x 5% -> 100 x 0.05)
        function executeMath(opts) {
            if (!calcState.operator || calcState.previousInput === null) return;
            const prev = parseFloat(calcState.previousInput);
            const curr = opts && opts.curr !== undefined ? opts.curr : parseFloat(calcState.currentInput);
            const op = calcState.operator;
            let result;
            switch (op) {
                case '+': result = prev + curr; break;
                case '-': result = prev - curr; break;
                case '×': result = prev * curr; break;
                case '÷': result = curr === 0 ? NaN : prev / curr; break;
            }
            if (!isFinite(result)) { setError(); return; }
            const label = (opts && opts.label) || formatNumber(curr);
            const text = `${formatNumber(prev)} ${op} ${label} = ${formatNumber(result)}`;
            pushHistory({ type: 'math', text, simpleText: text });
            calcState.currentInput = numToStr(result);
            calcState.previousInput = null;
            calcState.operator = null;
            calcState.awaitingNextNumber = true;
            updateDisplay();
        }

        function pressEquals() { handleKeyFeedback(); executeMath(); }

        function handlePercent() {
            handleKeyFeedback();
            if (calcState.currentInput === 'Error') return;
            const curr = parseFloat(calcState.currentInput);
            const label = formatNumber(curr) + '%';
            if (calcState.previousInput !== null && calcState.operator) {
                const prev = parseFloat(calcState.previousInput);
                if (calcState.operator === '+' || calcState.operator === '-') {
                    executeMath({ curr: prev * curr / 100, label });   // 200 + 10%  -> 220
                } else {
                    executeMath({ curr: curr / 100, label });          // 100 x 5%   -> 5
                }
                return;
            }
            calcState.currentInput = numToStr(curr / 100);              // 5% -> 0.05
            calcState.awaitingNextNumber = true;
            updateDisplay();
        }

        function handleBackspace() {
            handleKeyFeedback();
            if (calcState.currentInput === 'Error') { calcState.currentInput = '0'; }
            else if (!calcState.awaitingNextNumber) {
                const t = calcState.currentInput.slice(0, -1);
                calcState.currentInput = (t === '' || t === '-') ? '0' : t;
            }
            updateDisplay();
        }

        function resetAll() {
            handleKeyFeedback();
            calcState.currentInput = '0';
            calcState.previousInput = null;
            calcState.operator = null;
            calcState.awaitingNextNumber = false;
            updateDisplay();
        }

        function calculateGst(rateVal) {
            handleKeyFeedback();
            if (calcState.currentInput === 'Error') return;
            const amount = parseFloat(calcState.currentInput) || 0;
            if (amount === 0) return;

            const dp = calcState.decimalPrecision, m = Math.pow(10, dp);
            const rd = n => Math.round(n * m * (1 + Number.EPSILON)) / m;
            const isAdd = rateVal > 0;
            const absRate = Math.abs(rateVal);
            const halfRate = (absRate / 2).toFixed(2).replace(/\.?0+$/, '');

            let base, gst, total, baseText, gstText;
            if (isAdd) {
                base = amount;
                gst = rd(base * absRate / 100);
                total = rd(base + gst);
                baseText = money(base);
                gstText = `+ GST ${absRate}% = ${money(gst)}`;
            } else {
                total = amount;
                base = rd(total * 100 / (100 + absRate));
                gst = rd(total - base);
                baseText = `${money(total)} (Total)`;
                gstText = `- GST ${absRate}% = ${money(gst)} (Base: ${money(base)})`;
            }
            const cgst = rd(gst / 2), sgst = rd(gst - cgst);   // halves always add back up to GST

            pushHistory({
                type: 'gst',
                base: baseText,
                gst: gstText,
                cgst: `CGST ${halfRate}% = ${money(cgst)}`,
                sgst: `SGST ${halfRate}% = ${money(sgst)}`,
                total: `= ${money(total)}`,
                simpleText: `${isAdd ? '+' : '-'}${absRate}% GST on ${money(amount)} = ${money(total)}`
            });

            calcState.currentInput = total.toFixed(dp);
            calcState.awaitingNextNumber = true;
            updateDisplay();
        }

        function renderGstRows() {
            const rates = calcState.legacy ? [3, 5, 12, 18, 28, 40] : [3, 5, 18, 40];
            document.getElementById('gstRows').innerHTML = [1, -1].map(sign =>
                `<div class="grid gap-1.5 sm:gap-2" style="grid-template-columns:repeat(${rates.length},minmax(0,1fr))">` +
                rates.map(r => `<button type="button" class="btn-calc btn-gst font-bold text-xs sm:text-sm py-2 rounded-xl shadow-sm border" data-gst="${sign * r}" aria-label="${sign > 0 ? 'Add' : 'Remove'} ${r} percent GST" title="${sign > 0 ? 'Add GST (price excludes GST)' : 'Remove GST (price includes GST)'}">${sign > 0 ? '+' : '−'}${r}%</button>`).join('') +
                '</div>').join('');
        }

        function markDec() {
            document.querySelectorAll('.dec-opt-btn').forEach(b => {
                const on = parseInt(b.dataset.dec) === calcState.decimalPrecision;
                ['border-brandBlue', 'bg-blue-50', 'text-brandBlue'].forEach(c => b.classList.toggle(c, on));
            });
        }

        function pushHistory(recordObj) {
            recordObj.id = Date.now();
            recordObj.time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            calcState.history.unshift(recordObj);
            if (calcState.history.length > 50) calcState.history.pop();
            ls.set('gst_history', JSON.stringify(calcState.history));
            renderOnScreenTape();
            renderHistoryTape();
        }

        function renderOnScreenTape() {
            if (calcState.history.length === 0) {
                breakdownTape.innerHTML = '<div id="welcomeMessage" class="opacity-50 font-normal py-4 text-center w-full">Start calculating or select a GST rate...</div>';
                return;
            }
            breakdownTape.innerHTML = calcState.history.slice(0, 2).reverse().map(item => {
                if (item.type === 'gst') {
                    return `
                        <div class="w-full flex flex-col items-end space-y-0.5 border-b border-slate-300/30 pb-2 mb-1">
                            <div class="opacity-70 font-normal text-sm sm:text-base">${item.base}</div>
                            <div class="text-sm sm:text-base">${item.gst}</div>
                            <div class="opacity-80 text-xs sm:text-sm">${item.cgst}</div>
                            <div class="opacity-80 text-xs sm:text-sm">${item.sgst}</div>
                            <div class="mt-1">
                                <span class="bg-brandBlue text-white font-bold text-base sm:text-lg px-3 py-1 rounded-lg inline-block shadow-sm">
                                    ${item.total}
                                </span>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="w-full flex flex-col items-end border-b border-slate-300/30 pb-2 mb-1">
                            <div class="font-bold text-base sm:text-lg">${item.text}</div>
                        </div>
                    `;
                }
            }).join('');
            breakdownTape.scrollTop = breakdownTape.scrollHeight;
        }

        function renderHistoryTape() {
            if (calcState.history.length === 0) {
                tapeHistoryList.innerHTML = '<div class="text-slate-400 text-center py-8 font-sans">No history recorded yet</div>';
                return;
            }
            tapeHistoryList.innerHTML = calcState.history.map(item => {
                if (item.type === 'gst') {
                    return `
                        <div class="p-3 bg-slate-50 border border-slate-100 rounded-lg flex flex-col items-end space-y-0.5 text-right">
                            <div class="opacity-70 font-normal">${item.base}</div>
                            <div>${item.gst}</div>
                            <div class="opacity-80 text-[11px]">${item.cgst}</div>
                            <div class="opacity-80 text-[11px]">${item.sgst}</div>
                            <div class="mt-1">
                                <span class="bg-brandBlue text-white font-bold px-2 py-0.5 rounded text-xs inline-block shadow-sm">
                                    ${item.total}
                                </span>
                            </div>
                            <div class="w-full text-left text-[10px] text-slate-400 font-sans mt-2 pt-1 border-t border-slate-200/60">${item.time}</div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="p-2.5 bg-slate-50 border border-slate-100 rounded-lg flex items-center justify-between">
                            <div>
                                <div class="font-bold text-slate-700">${item.text}</div>
                                <div class="text-[10px] text-slate-400 font-sans">${item.time}</div>
                            </div>
                        </div>
                    `;
                }
            }).join('');
        }

        function applyTheme(themeName) {
            document.body.className = `theme-${themeName} font-sans flex flex-col justify-between overflow-hidden antialiased transition-colors duration-200`;
            calcState.theme = themeName;
            const tc = { light: '#ffffff', dark: '#1e293b', solar: '#7c8a75' }[themeName];
            document.querySelector('meta[name=theme-color]').setAttribute('content', tc);
            ls.set('gst_theme', themeName);
            document.querySelectorAll('.theme-opt-btn').forEach(btn => {
                if (btn.dataset.theme === themeName) {
                    btn.classList.add('border-brandBlue', 'bg-blue-50', 'text-brandBlue');
                } else {
                    btn.classList.remove('border-brandBlue', 'bg-blue-50', 'text-brandBlue');
                }
            });
        }

        document.getElementById('settingsBtn').addEventListener('click', () => {
            settingsModal.classList.remove('hidden');
            setTimeout(() => settingsModal.classList.remove('opacity-0'), 10);
        });

        function hideSettings() {
            settingsModal.classList.add('opacity-0');
            setTimeout(() => settingsModal.classList.add('hidden'), 200);
        }

        document.getElementById('closeSettingsBtn').addEventListener('click', hideSettings);

        document.getElementById('tapeToggleBtn').addEventListener('click', () => {
            renderHistoryTape();
            tapeDrawer.classList.remove('hidden');
            setTimeout(() => tapeDrawer.classList.remove('opacity-0'), 10);
        });

        document.getElementById('closeTapeBtn').addEventListener('click', () => {
            tapeDrawer.classList.add('opacity-0');
            setTimeout(() => tapeDrawer.classList.add('hidden'), 200);
        });

        document.getElementById('clearTapeBtn').addEventListener('click', () => {
            calcState.history = [];
            ls.del('gst_history');
            renderOnScreenTape();
            renderHistoryTape();
            showToast('History Cleared');
        });

        document.getElementById('printReceiptBtn').addEventListener('click', () => {
            if (calcState.history.length === 0) {
                showToast('No items to print');
                return;
            }
            document.getElementById('receiptDate').textContent = new Date().toLocaleString();
            document.getElementById('receiptItems').innerHTML = calcState.history.map(i => `
                <div class="flex justify-between border-b border-dashed pb-1">
                    <span>${i.simpleText || i.text}</span>
                    <span class="text-xs text-slate-400">${i.time}</span>
                </div>
            `).join('');
            window.print();
        });

        document.querySelectorAll('.num-btn').forEach(btn => btn.addEventListener('click', () => appendNumber(btn.dataset.num)));
        document.querySelectorAll('.btn-op').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.dataset.op) handleOperator(btn.dataset.op);
                else if (btn.dataset.action === 'percent') handlePercent();
            });
        });
        document.getElementById('gstRows').addEventListener('click', (e) => { const b = e.target.closest('.btn-gst'); if (b) calculateGst(parseFloat(b.dataset.gst)); });
        document.querySelectorAll('.btn-action').forEach(btn => {
            btn.addEventListener('click', () => {
                const act = btn.dataset.action;
                if (act === 'ac') resetAll();
                else if (act === 'backspace') handleBackspace();
            });
        });
        document.querySelector('.btn-equal').addEventListener('click', pressEquals);

        document.querySelectorAll('.dec-opt-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                calcState.decimalPrecision = parseInt(btn.dataset.dec);
                ls.set('gst_dec', calcState.decimalPrecision); markDec();
                updateDisplay();
                hideSettings();
            });
        });

        document.querySelectorAll('.theme-opt-btn').forEach(btn => {
            btn.addEventListener('click', () => applyTheme(btn.dataset.theme));
        });

        const soundToggle = document.getElementById('soundToggle');
        const hapticToggle = document.getElementById('hapticToggle');
        soundToggle.checked = calcState.soundEnabled;
        hapticToggle.checked = calcState.hapticEnabled;

        soundToggle.addEventListener('change', (e) => {
            calcState.soundEnabled = e.target.checked;
            ls.set('gst_sound', e.target.checked);
        });

        hapticToggle.addEventListener('change', (e) => {
            calcState.hapticEnabled = e.target.checked;
            ls.set('gst_haptic', e.target.checked);
        });

        document.getElementById('copyBtn').addEventListener('click', () => {
            const val = mainDisplay.textContent.replace(/,/g, '');
            const fallback = () => {
                const ta = document.createElement('textarea');
                ta.value = val; ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.select();
                try { document.execCommand('copy'); } catch (e) {}
                ta.remove();
            };
            (navigator.clipboard ? navigator.clipboard.writeText(val).catch(fallback) : Promise.resolve(fallback()))
                .then(() => showToast('Copied: ' + val));
        });

        document.getElementById('shareBtn').addEventListener('click', () => {
            const lastItem = calcState.history[0];
            const summaryText = lastItem && lastItem.type === 'gst' 
                ? `*GST Calculation Summary*\nBase: ${lastItem.base}\nBreakdown: ${lastItem.gst}\n*Total: ${lastItem.total}*`
                : `*Calculation Summary*\nResult: ${mainDisplay.textContent}`;
            if (navigator.share) {
                navigator.share({ title: 'GST Calculation', text: summaryText }).catch(() => {});
            } else {
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(summaryText)}`, '_blank');
            }
        });

        window.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            if (!settingsModal.classList.contains('hidden') || !tapeDrawer.classList.contains('hidden')) return;
            const k = e.key;
            if (k >= '0' && k <= '9') appendNumber(k);
            else if (k === '.' || k === ',') appendNumber('.');
            else if (k === '+') handleOperator('+');
            else if (k === '-') handleOperator('-');
            else if (k === '*' || k === 'x' || k === 'X') handleOperator('×');
            else if (k === '/') { e.preventDefault(); handleOperator('÷'); }
            else if (k === '%') handlePercent();
            else if (k === 'Enter' || k === '=') { e.preventDefault(); pressEquals(); }
            else if (k === 'Backspace') handleBackspace();
            else if (k === 'Escape' || k === 'Delete' || k === 'c' || k === 'C') resetAll();
        });

        const legacyToggle = document.getElementById('legacyToggle');
        legacyToggle.checked = calcState.legacy;
        legacyToggle.addEventListener('change', (e) => {
            calcState.legacy = e.target.checked;
            ls.set('gst_legacy', e.target.checked);
            renderGstRows();
        });

        renderGstRows();
        markDec();
        updateDisplay();
        applyTheme(calcState.theme);
        renderOnScreenTape();

        const installBtn = document.getElementById('installPwaBtn');
        const pwaBadge = document.getElementById('pwaBadge');
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        if (isStandalone) pwaBadge.classList.remove('hidden');

        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });
        window.addEventListener('appinstalled', () => {
            deferredPrompt = null;
            installBtn.classList.add('hidden');
            showToast('App installed');
        });
        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            deferredPrompt = null;
            installBtn.classList.add('hidden');
        });
        // iOS Safari has no install prompt: show a one-time hint instead
        if (!isStandalone && /iphone|ipad|ipod/i.test(navigator.userAgent) && !ls.get('gst_ios_hint')) {
            setTimeout(() => { showToast('Install: tap Share, then Add to Home Screen'); ls.set('gst_ios_hint', '1'); }, 1500);
        }

        if ('serviceWorker' in navigator && window.isSecureContext) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {}); // optional: only if sw.js sits next to this file
            });
        }
    </script>
</body>
</html>
